name: DevOps Java CI Automation Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-validate:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        java-version: [17, 21]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: temurin
          cache: maven
          cache-dependency-path: maven-automation-pipeline/pom.xml

      - name: Compile Code Base
        working-directory: maven-automation-pipeline
        run: mvn clean compile

      - name: Run Automated Test Suites
        working-directory: maven-automation-pipeline
        run: mvn test

      - name: Package Executable Distribution
        working-directory: maven-automation-pipeline
        run: mvn package

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-ready-jar-java-${{ matrix.java-version }}
          path: maven-automation-pipeline/target/*.jar
          retention-days: 5

  deploy-staging:
    needs: build-and-validate
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Deploy to Staging Container
        working-directory: maven-automation-pipeline
        run: |
          echo "Approval granted! Deploying to staging stack..."
          docker compose up -d
          sleep 5
          curl http://localhost:8085
